# TheRARBG Search Engine Configuration
# RARBG revival - movies, TV, apps, and IMDB-indexed posts via JSON API.
# Uses direct therarbg.to first for speed, with therarbg.com and codetabs proxy fallbacks.

id: therarbg
display_name: "TheRARBG"
icon: search

# Engine capabilities
capabilities:
  keyword_search: true
  imdb_search: true       # IMDB ID is matched as a keyword in post names
  series_support: false   # Series queries fall back to keyword path

# API endpoints - direct primary with mirror and proxy fallbacks
api:
  urls:
    keyword: "https://therarbg.to/get-posts/keywords:{query}:format:json/?page={page}"
    imdb:    "https://therarbg.to/get-posts/keywords:{imdb_id}:format:json/?page={page}"
  fallback_urls:
    keyword:
      - "https://therarbg.com/get-posts/keywords:{query}:format:json/?page={page}"
      - "https://api.codetabs.com/v1/proxy?quest=https://therarbg.to/get-posts/keywords:{query}:format:json/?page={page}"
    imdb:
      - "https://therarbg.com/get-posts/keywords:{imdb_id}:format:json/?page={page}"
      - "https://api.codetabs.com/v1/proxy?quest=https://therarbg.to/get-posts/keywords:{imdb_id}:format:json/?page={page}"

# Path-template URL builder
path_params:
  type: path_params

# Page-based pagination embedded into the URL template via {page}.
pagination:
  type: page
  results_per_page: 50
  max_pages: 4
  page:
    param_name: page
    start_page: 1
    has_more_field: "links.next"
    location: path

# Response format - direct JSON, results live under "results"
response_format:
  type: json
  results_path: "results"

# Field mappings - TheRARBG uses compact single-letter keys
# h=hash, n=name, s=size, se=seeders, le=leechers, a=added, c=category
field_mappings:
  infohash:
    source: "h"
    type: direct
    conversion: lowercase
  name:
    source: "n"
    type: direct
  size_bytes:
    source: "s"
    type: direct
  seeders:
    source: "se"
    type: direct
  leechers:
    source: "le"
    type: direct
  created_unix:
    source: "a"
    type: direct
  category:
    source: "c"
    type: direct

# User-configurable settings
settings:
  - id: enabled
    type: toggle
    label: "Enable TheRARBG"
    default: true
  - id: max_results
    type: dropdown
    label: "Maximum Results"
    default: 100
    options: [50, 100, 150, 200]

# TV mode configuration
tv_mode:
  enabled_default: true
  limits:
    small: 50
    large: 100
    quick_play: 50
