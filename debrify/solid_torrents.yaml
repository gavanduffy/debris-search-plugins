# SolidTorrents / Bitsearch Search Engine Configuration
# Comprehensive torrent search via Bitsearch/SolidTorrents API

id: solid_torrents
display_name: "SolidTorrents"
icon: storage

# Engine capabilities
capabilities:
  keyword_search: true
  imdb_search: true
  series_support: false

# API endpoint (solidtorrents.to redirects to bitsearch.eu)
api:
  urls:
    keyword: "https://bitsearch.eu/api/v1/search?limit=100&sort=seeders"
    imdb: "https://bitsearch.eu/api/v1/search?limit=100&sort=seeders"
  fallback_urls:
    keyword:
      - "https://solidtorrents.to/api/v1/search?limit=100&sort=seeders"
      - "https://r.jina.ai/https://bitsearch.eu/api/v1/search?limit=100&sort=seeders"
    imdb:
      - "https://solidtorrents.to/api/v1/search?limit=100&sort=seeders"
      - "https://r.jina.ai/https://bitsearch.eu/api/v1/search?limit=100&sort=seeders"

# Query parameters
query_params:
  type: query_params
  param_name: "q"

# Pagination configuration - Page-based
pagination:
  type: page
  page_size: 100  # API returns up to 100 per page with limit=100
  max_pages: 5    # 5 pages × 100 = 500 max results
  start_page: 1
  page_param: "page"
  has_more_field: "pagination.hasNext"

# Response format - direct JSON (still unwraps Jina automatically on fallback)
response_format:
  type: direct_json
  extract_json: true
  results_path: "results"

# Pre-checks for valid response
pre_checks:
  - field: "success"
    equals: true

# Field mappings with transformations
field_mappings:
  infohash:
    source: "infohash"
    type: direct
    conversion: lowercase
  name:
    source: "title"
    type: direct
  size_bytes:
    source: "size"
    type: direct
  seeders:
    source: "seeders"
    type: direct
  leechers:
    source: "leechers"
    type: direct
  created_unix:
    source: "updatedAt"
    type: direct
  category:
    type: template
    template: "{category} > {subCategory}"

# User-configurable settings
settings:
  - id: enabled
    type: toggle
    label: "Enable SolidTorrents"
    default: true
  - id: max_results
    type: dropdown
    label: "Maximum Results"
    default: 100
    options: [100, 200, 300, 400, 500]

# TV mode specific configuration
tv_mode:
  enabled_default: false
  limits:
    small: 100
    large: 100
    quick_play: 200

# Request override
request:
  timeout_seconds: 15
